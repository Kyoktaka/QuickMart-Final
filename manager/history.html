<main>
<!-- TAB 2: TRANSACTION HISTORY (completed & cancelled) -->
<section id="tab-history" class="tab active">
  <div class="head"><div><h1>Transaction History</h1><p class="sub">View all completed and cancelled transactions.</p></div><div class="clock" data-clock></div></div>
  <div class="tools">
    <div class="hfield date" id="date-btn" role="button" tabindex="0" aria-label="Select date range">
      <span id="date-label">All dates</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </div>
    <div class="pop" id="date-pop">
      <label>From<input type="date" id="history-from"></label>
      <label>To<input type="date" id="history-to"></label>
      <button class="btn ghost" id="history-reset" type="button">Clear filters</button>
    </div>
    <label class="hfield search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="history-search" name="history-transaction-search" type="search" placeholder="Search transaction id..." aria-label="Search transaction id" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other">
    </label>
    <button class="btn dark hfilter" id="filter-btn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
      Filter <span class="fdot" id="filter-dot"></span>
    </button>
    <div class="pop right" id="filter-pop">
      <label>Status
        <select id="history-status" aria-label="Status filter"><option value="">All status</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
      </label>
    </div>
  </div>
  <div class="tx-card">
    <table id="history-table"><thead><tr><th style="width:76px">#</th><th>Transaction ID</th><th>Date &amp; Time</th><th>Total Items</th><th>Total Amount</th><th>Status</th></tr></thead><tbody id="history-body"></tbody></table>
  </div>
  <div class="tx-foot"><span id="history-count"></span><div class="pg" id="history-pg"></div></div>
</section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
