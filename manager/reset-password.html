<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reset Manager Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0
        }

        .box {
            width: min(420px, 90vw);
            background: #fff;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 12px 40px #0001
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 7px 0 14px;
            border: 1px solid #ccd5e0;
            border-radius: 9px
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 9px;
            background: #001f3f;
            color: #fff;
            font-weight: 700
        }

        .ok {
            color: #176b3a
        }

        .err {
            color: #b42318
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Reset Password</h1>
        <p id="msg"></p>
        <form id="form">
            <label>New password</label>
            <input id="pw" type="password" minlength="8" required>
            <label>Confirm password</label>
            <input id="pw2" type="password" minlength="8" required>
            <button>Update password</button>
        </form>
    </div>
    <script>
        const token = new URLSearchParams(location.search).get('token'),
            msg = document.getElementById('msg');
        document.getElementById('form').onsubmit = async e => {
            e.preventDefault();
            msg.className = '';
            const a = document.getElementById('pw').value,
                b = document.getElementById('pw2').value;
            if (a.length < 8) return msg.textContent = 'Password must be at least 8 characters.';
            if (a !== b) return msg.textContent = 'Passwords do not match.';
            try {
                const r = await fetch('../api/auth/reset-password.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ token, password: a })
                });
                const d = await r.json();
                msg.textContent = d.message || 'Done.';
                msg.className = d.success ? 'ok' : 'err';
                if (d.success) document.getElementById('form').remove()
            } catch {
                msg.textContent = 'Could not reach the server.';
                msg.className = 'err'
            }
        };
    </script>
</body>

</html>
