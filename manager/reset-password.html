<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickMart Password Reset</title>
</head>
<body>
<p>Opening the QuickMart password reset form… <a id="go" href="login.html">Continue</a></p>
<script>
const params=new URLSearchParams(location.search);
const token=params.get('token')||params.get('reset_token')||'';
const target='login.html'+(token?'?reset_token='+encodeURIComponent(token):'');
document.querySelector('#go').href=target;
location.replace(target);
</script>
</body>
</html>
