<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickMart Password Reset</title>
</head>
<body>
<p>Opening the QuickMart password reset form… <a id="go" href="../index.html">Continue</a></p>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const target='../index.html'+(token?'?reset_token='+encodeURIComponent(token):'');
document.querySelector('#go').href=target;
location.replace(target);
</script>
</body>
</html>
