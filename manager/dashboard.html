<section id="tab-dashboard" class="tab active dash">
  <div class="head"><div><h1>Dashboard</h1><p class="welcome" id="welcome-msg">Welcome back!</p></div><div class="clock" data-clock></div></div>
  <section class="stats">
    <article class="stat"><div><span class="stat-label">Total Products</span><strong id="stat-products">0</strong></div><span class="stat-icon bg-orange"><svg viewBox="0 0 24 24"><path d="M2 3h3l3 12h11l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg></span></article>
    <article class="stat"><div><span class="stat-label">Low Stock Items</span><strong id="stat-low">0</strong></div><span class="stat-icon bg-red"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h6"/></svg></span></article>
    <article class="stat"><div><span class="stat-label">Today's Transaction</span><strong id="stat-trx">0</strong></div><span class="stat-icon bg-green"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h8M4 18h6M17 20v-8M14 15l3-3 3 3"/></svg></span></article>
    <article class="stat"><div><span class="stat-label">Total Sales (Today)</span><strong id="stat-sales">₱0.00</strong></div><span class="stat-icon bg-green"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 18V7h4a3 3 0 0 1 0 6H9M8 10h7"/></svg></span></article>
  </section>
  <section class="panels">
    <article class="panel">
      <div class="panel-head"><h2>Sales Overview</h2>
        <div class="seg" id="range"><button class="on" data-r="daily">Daily</button><button data-r="weekly">Weekly</button></div></div>
      <div class="chartbox"><canvas id="salesChart"></canvas></div>
    </article>
    <article class="panel">
      <div class="panel-head"><h2>Recent Activities</h2></div>
      <ul class="feed activity-list" id="activity-feed" aria-live="polite"></ul>
    </article>
  </section>
</section>
