name: QuickMart syntax checks
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find api config includes manager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Frontend JavaScript syntax
        run: |
          find js assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate two fixed demo QR outcomes
        run: php tests/demo-qr.php
      - name: Product description/schema contract
        run: php tests/product-description-contract.php
      - name: Preserve manual keyboard and RFID scanning focus
        run: node tests/manual-keyboard.js
      - name: RFID presence and scan regression tests
        run: node tests/rfid-scanner.js
      - name: Multi-tag restocking and product isolation tests
        run: node tests/inventory-batch.js
      - name: RFID kiosk twenty-tag and removal tests
        run: node tests/kiosk-presence.js
      - name: Final frontend integration smoke tests
        run: node tests/integration-smoke.js
